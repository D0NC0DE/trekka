services:
  postgres:
    image: postgres:18-alpine
    container_name: trekka_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trekka_postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trekka_postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: trekka_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trekka_postgres}:${POSTGRES_PASSWORD:-trekka_postgres}@postgres:5432/${POSTGRES_DB:-appdb}"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-trekka_postgres}:${POSTGRES_PASSWORD:-trekka_postgres}@postgres:5432/${POSTGRES_DB:-appdb}"
      PORT: ${PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules

volumes:
  pg_data:
  api_node_modules:
